# SPDX-License-Identifier: Apache-2.0

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:

name: AVR Tests

jobs:
  avr_test:
    name: Run AVR Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install nightly toolchain for AVR
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2025-11-01
          components: rust-src

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            avr_demo
            picojson

      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: simavr gcc-avr avr-libc
          version: 1.0

      - name: Cache cargo binaries
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/cargo-bloat
            ~/.cargo/bin/cargo-nm
            ~/.cargo/bin/cargo-objcopy
            ~/.cargo/bin/cargo-objdump
            ~/.cargo/bin/cargo-size
            ~/.cargo/bin/cargo-strip
          key: ${{ runner.os }}-cargo-bins-bloat-binutils-v1

      - name: Install cargo-bloat
        run: |
          if ! command -v cargo-bloat &> /dev/null; then
            cargo install cargo-bloat --locked
          fi
      - name: Install cargo-binutils
        run: |
          if ! command -v cargo-nm &> /dev/null; then
            cargo install cargo-binutils --locked
          fi

      - name: Install krabi-caliper host tooling
        run: cargo install krabi-caliper --git https://github.com/kaidokert/krabi-caliper-rs --tag v0.1.0-alpha.2 --features cli,campaign

      - name: Run Stack Analysis
        working-directory: avr_demo
        run: cargo krabi-caliper run picojson-avr-stack

      - name: Run Bloat Analysis
        working-directory: avr_demo
        run: python run_suite.py bloat

  avr_panic_check:
    name: AVR Panic Prevention (${{ matrix.int_type }}, ${{ matrix.pico_size }}, ${{ matrix.profile }}, defmt=${{ matrix.defmt }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example: [test_picojson, test_streamparser]
        int_type: [int8, int32]
        profile: [release, dev]
        pico_size: [pico-tiny, pico-huge]
        defmt: [false, true]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install nightly toolchain for AVR
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: nightly-2025-11-01
          components: rust-src

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            avr_demo
            picojson

      - name: Cache APT packages
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: simavr gcc-avr avr-libc binutils-avr
          version: 1.0

      - name: Install krabi-caliper
        run: cargo install krabi-caliper --git https://github.com/kaidokert/krabi-caliper-rs --tag v0.1.0-alpha.2 --features cli,campaign

      - name: Compose feature set
        id: feature_set
        shell: bash
        run: |
          # The measured examples use the UART-backed UfmtReporter as
          # their transport, so `ufmt` is required even though this
          # matrix deliberately disables the crate's default features.
          FEATURES="${{ matrix.int_type }},${{ matrix.pico_size }},ufmt"
          if [ "${{ matrix.defmt }}" = "true" ]; then
            FEATURES="${FEATURES},defmt"
          fi
          echo "features=${FEATURES}" >> "$GITHUB_OUTPUT"

      - name: Audit parser panic paths with negative controls
        working-directory: avr_demo
        run: |
          cargo krabi-caliper panic-audit \
            --package avr_demo \
            --artifact-kind example \
            --artifact-name "${{ matrix.example }}" \
            --negative-artifact-name minimal \
            --target avr-none \
            --profile "${{ matrix.profile }}" \
            --no-default-features \
            --features "${{ steps.feature_set.outputs.features }}" \
            --negative-features neg-controls \
            --owned-symbol '^picojson::' \
            --owned-symbol '^panic_audit__neg__' \
            --expect-negative 'panic_audit__neg__bounds' \
            --expect-negative 'panic_audit__neg__unwrap' \
            --expect-negative 'panic_audit__neg__expect' \
            --json "target/panic-audit/${{ matrix.example }}-${{ matrix.int_type }}-${{ matrix.profile }}-${{ matrix.pico_size }}-${{ matrix.defmt }}.json"
