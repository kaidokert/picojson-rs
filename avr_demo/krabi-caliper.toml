[profiles.simavr-atmega2560]
preset = "simavr-atmega2560"
timeout-seconds = 5

[campaigns.picojson-avr-stack]
profile = "simavr-atmega2560"
case-set = "picojson-avr"
continue-on-failure = true
matrix-features = ["depth-{depth}"]

[campaigns.picojson-avr-stack.matrix]
depth = ["7", "9", "30", "33", "62", "65", "126", "129", "254", "257", "510", "513", "1022", "1025"]

[campaigns.picojson-avr-smoke]
profile = "simavr-atmega2560"
case-set = "picojson-avr"
matrix-features = ["depth-{depth}"]

[campaigns.picojson-avr-smoke.matrix]
depth = ["7"]

[[case-sets.picojson-avr]]
name = "serde"
example = "test_serde"
features = ["ufmt", "int8"]
expected-benchmark = "serde-json-core"

[[case-sets.picojson-avr]]
name = "slice-tiny"
example = "test_picojson"
features = ["pico-tiny", "ufmt", "int8"]
